spring.application.name=mediqueue-api

# Load per-machine settings (DB credentials etc.) from a git-ignored .env file in the
# project root, if present. Copy .env.example to .env and fill it in.
# Real environment variables still take precedence over values in .env.
spring.config.import=optional:file:.env[.properties]

# ---------------------------------------------------------------------------
# Database (PostgreSQL)
# Defaults match compose.yaml. Override per machine in .env or with environment
# variables: DB_URL, DB_USERNAME, DB_PASSWORD
# ---------------------------------------------------------------------------
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/mediqueue}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

# ---------------------------------------------------------------------------
# JPA / Hibernate
# Flyway owns schema changes; validate checks entity mappings at startup.
# ---------------------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=validate
# Keep database access inside services (transactions), never in controllers/JSON rendering.
spring.jpa.open-in-view=false
# Set to true to print the SQL Hibernate runs (useful while learning/debugging).
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# ---------------------------------------------------------------------------
# Web
# ---------------------------------------------------------------------------
# Paging: ?page=0&size=20&sort=name,asc  (size is capped to protect the database)
spring.data.web.pageable.default-page-size=20
spring.data.web.pageable.max-page-size=100

# ---------------------------------------------------------------------------
# API documentation (springdoc)
# ---------------------------------------------------------------------------
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# ---------------------------------------------------------------------------
# Actuator
# ---------------------------------------------------------------------------
management.endpoints.web.exposure.include=health,info,prometheus
# Show each health check (db, diskSpace, ping) by name and status, without details
# such as the database URL. The welcome page at / reads this to show its system checks.
management.endpoint.health.show-components=always

# /actuator/info: build details for the welcome page. The @...@ values are filled in
# by Maven from pom.xml at build time; the Java runtime version is detected on startup.
management.info.env.enabled=true
management.info.java.enabled=true
info.app.name=@project.name@
info.app.version=@project.version@
info.app.spring-boot=@project.parent.version@
server.port=${PORT:8082}
# Comma-separated browser origins permitted to call the API.
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173}
# JWT Authentication
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:900000}
app.jwt.refresh-expiration-ms=${JWT_REFRESH_EXPIRATION_MS:604800000}
app.jwt.secret=${JWT_SECRET}

# Development data is opt-in and only loaded when the dev profile is active.
app.dev-seed.enabled=false
