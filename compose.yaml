# Optional: a local PostgreSQL for development.
#   Start:  docker compose up -d
#   Stop:   docker compose down        (add -v to also delete the data)
# Credentials match the defaults in src/main/resources/application.properties.
services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: springapi
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql

volumes:
  postgres-data:
